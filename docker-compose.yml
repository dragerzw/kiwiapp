# ──────────────────────────────────────────────
# KiwiApp — Local Development Stack
# Usage: docker compose up --build
# ──────────────────────────────────────────────

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kiwi-api
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      FLASK_ENV: development
      DATABASE_URL: mysql+pymysql://kiwi:kiwi_secret@db:3306/kiwiapp
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:5000
        VITE_COGNITO_AUTHORITY: ${VITE_COGNITO_AUTHORITY}
        VITE_COGNITO_CLIENT_ID: ${VITE_COGNITO_CLIENT_ID}
        VITE_COGNITO_REDIRECT_URI: http://localhost:8080/
        VITE_COGNITO_POST_LOGOUT_REDIRECT_URI: http://localhost:8080/signed-out
        VITE_COGNITO_SCOPE: "openid email profile"
    container_name: kiwi-frontend
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped

  db:
    image: mysql:8.0
    container_name: kiwi-db
    environment:
      MYSQL_ROOT_PASSWORD: root_secret
      MYSQL_DATABASE: kiwiapp
      MYSQL_USER: kiwi
      MYSQL_PASSWORD: kiwi_secret
    ports:
      - "3306:3306"
    volumes:
      - kiwi_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  kiwi_db_data:
